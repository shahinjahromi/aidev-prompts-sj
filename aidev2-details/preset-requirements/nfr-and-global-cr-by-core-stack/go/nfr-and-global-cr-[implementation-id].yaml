type: nfr_and_global_cr
generated_at: "2026-04-13"
items:

- id: NFR-0000008-startup-operability
  section: Startup Operability
  text: >-
    The application repository shall provide a bash startup script at
    scripts/local-dev.sh that starts the application in a runnable local
    development mode from a standard shell environment. The script must be
    idempotent, executable without root privileges, and documented in the
    repository README.
  acceptance_criteria:
  - id: AC-0000022-startup-script-exists-and-starts-app
    title: Startup script exists and starts the app
    context: Developers and automation need a single predictable entry point to start the application locally.
    criteria:
    - A bash script exists at scripts/local-dev.sh in the application repository.
    - The script is executable or runnable with bash scripts/local-dev.sh.
    - Running the script starts the application without requiring ad hoc manual steps.
    - The script is idempotent — running it twice does not cause errors or duplicate processes.
  acceptance_tests:
  - id: AT-0000022-verify-startup-script
    name: Verify startup script exists and starts the app
    steps:
    - Verify that scripts/local-dev.sh exists.
    - Run bash scripts/local-dev.sh from the application repository root.
    - Verify the application starts without error.
    expected_result: The file scripts/local-dev.sh exists and running it starts the application.

- id: GLOBAL-0000003-go-code-quality
  section: Code Quality
  text: >-
    All Go source files must comply with the Go code quality standards: formatted
    with gofmt/goimports, no flag arguments, explicit error handling, well-named
    identifiers, and no mutable global state.
  acceptance_criteria:
  - id: AC-0000023-go-formatting
    title: Go source files are properly formatted
    context: Consistent formatting reduces review friction and prevents whitespace conflicts.
    criteria:
    - All .go files are formatted according to gofmt without deviation.
    - No flag arguments (bool params controlling internal branching) are used.
    - All errors are checked explicitly — errors are never silently discarded.
  acceptance_tests:
  - id: AT-0000023-verify-go-formatting
    name: Verify Go source formatting
    steps:
    - Run gofmt -l ./... and verify output is empty.
    - Review function signatures for bool flag arguments.
    expected_result: gofmt reports no files need formatting.

- id: GLOBAL-0000004-golang-module-layout
  section: Code Organization
  module: core
  text: >-
    All server-side implementation code must reside under internal/. Files with
    a module field go to internal/<module_name>/. Files without a module field go
    to internal/default/. No Go source files may appear at the repository root
    except main.go entrypoints under cmd/<entrypoint>/.
  acceptance_criteria:
  - id: AC-0000024-golang-internal-layout
    title: Go source files are organized under internal/
    context: The internal/ convention enforces encapsulation and module boundaries.
    criteria:
    - No .go files exist at the repository root other than main.go under cmd/.
    - All requirement implementation code resides under internal/<module_name>/ or internal/default/.
  acceptance_tests:
  - id: AT-0000024-verify-internal-layout
    name: Verify Go internal/ layout
    steps:
    - List all .go files in the repository.
    - Verify none are at the root other than cmd/<entrypoint>/main.go.
    - Verify each module has its own subfolder under internal/.
    expected_result: All .go source files are under internal/ or cmd/.

- id: GLOBAL-0000005-security-headers
  section: Security
  text: >-
    All HTTP responses must include the required security headers. A middleware
    layer must set X-Content-Type-Options nosniff, Strict-Transport-Security, and
    X-Frame-Options DENY on every response. CORS must use an explicit allowlist.
    Request body size must be limited before reading.
  acceptance_criteria:
  - id: AC-0000025-security-headers-on-all-responses
    title: Security headers present on all responses
    context: Missing security headers are a common finding in banking API security reviews.
    criteria:
    - A middleware layer sets X-Content-Type-Options nosniff on every response.
    - Strict-Transport-Security is set on every response.
    - X-Frame-Options DENY is set on every response.
    - CORS is configured using an explicit allowlist; wildcard origin is never used on authenticated endpoints.
    - Request body size is limited before reading.
  acceptance_tests:
  - id: AT-0000025-verify-security-headers
    name: Verify security headers on HTTP responses
    steps:
    - Start the application.
    - Send an HTTP request to any endpoint.
    - Inspect response headers.
    expected_result: Response includes X-Content-Type-Options, Strict-Transport-Security, and X-Frame-Options headers.

- id: GLOBAL-0000001-module-based-url-topology
  section: API Design
  text: >-
    Every registered HTTP route must use the declaring module name as the first
    non-version path segment. For example, a requirement with module "accounts"
    must register routes under /accounts/. No route may use an abbreviated,
    aliased, or generic path that diverges from the module name.
  acceptance_criteria:
  - id: AC-0000026-route-top-segment-matches-module
    title: All routes use module name as top-level segment
    context: Consistent URL structure tied to module names makes the API predictable and auditable.
    criteria:
    - Every registered route first non-version path segment matches its declaring module name exactly.
    - No route uses an abbreviated or aliased path without documented justification.
    - Chi route groups are registered as r.Route("/<module_name>", ...).
  acceptance_tests:
  - id: AT-0000026-verify-route-topology
    name: Verify all routes use module name as top-level segment
    steps:
    - Enumerate all registered routes.
    - For each route, identify the first non-version path segment.
    - Verify it matches the module name of the requirement it implements.
    expected_result: All routes have the module name as their first domain-specific path segment.

- id: GLOBAL-0000002-api-error-response-schema
  section: API Design
  text: >-
    All API error responses must conform to the API Error Response Schema
    (MAC-0000001-api-error-response-schema). Every error response body must
    include at minimum the required fields: code (machine-readable error code)
    and message (human-readable summary). Optional fields target, reference,
    and issues may be included when relevant.
  contract_refs:
  - contract_type: models_and_contracts
    selection: specific_ids
    specific_ids:
    - id: MAC-0000001-api-error-response-schema
  acceptance_criteria:
  - id: AC-0000027-api-errors-conform-to-schema
    title: All API error responses conform to the error schema
    context: Consistent error response structure is required for client portability and auditability.
    criteria:
    - Every API error response body includes a code field (string, machine-readable).
    - Every API error response body includes a message field (string, human-readable).
    - No additional properties are present beyond those defined in the schema.
    - When multiple validation issues occur, they are returned in the issues array.
  acceptance_tests:
  - id: AT-0000027-verify-api-error-schema-compliance
    name: Verify API error responses conform to schema
    steps:
    - Trigger an error condition on any API endpoint (e.g. invalid request body).
    - Inspect the response body.
    - Validate the response body against MAC-0000001-api-error-response-schema.
    expected_result: All API error response bodies validate against the API Error Response Schema with at minimum code and message fields present.

- id: NFR-0000012-idempotency
  section: API Design
  text: >-
    All mutation endpoints must support idempotent request handling via the
    Idempotency-Key request header. The server must retain the result of the
    first processed request for 7 days and return the cached response unchanged
    for duplicate requests within that window. The internal deduplication key
    must be formed as <consumer_id>-<idempotency_key>, where consumer_id is the
    authenticated user's ID for human consumers and the configured client ID for
    M2M (service-to-service) consumers. Two different consumers submitting the
    same Idempotency-Key value must never share a cached result.
  acceptance_criteria:
  - id: AC-0000028-idempotency-key-behavior
    title: Idempotency-Key header enforces per-consumer deduplication
    context: >-
      Mutation endpoints in banking systems must be safe to retry without
      causing duplicate side effects. The deduplication scope must be per
      consumer to prevent cross-consumer key collisions.
    criteria:
    - The header name for client-supplied idempotency keys is exactly Idempotency-Key.
    - The server stores the result of the first processed request for 7 days from the time of that first request.
    - The internal deduplication key is formed by concatenating consumer_id and the client-supplied Idempotency-Key value as <consumer_id>-<idempotency_key>.
    - For human (end-user) consumers, consumer_id is the authenticated user's ID in the bank system.
    - For M2M (service-to-service) consumers, consumer_id is the client ID configured in the system for that service.
    - Two different consumers submitting the same Idempotency-Key value are not treated as the same request and do not share a cached result.
    - A duplicate request from the same consumer within the 7-day retention window returns the cached response unchanged without reprocessing.
  acceptance_tests:
  - id: AT-0000028-verify-idempotency-key-behavior
    name: Verify Idempotency-Key header enforces per-consumer deduplication
    steps:
    - Submit a mutation request with Idempotency-Key: test-key-001 as consumer A; record the response body and status code.
    - Submit the identical request again with Idempotency-Key: test-key-001 as consumer A within 7 days of the first request.
    - Verify the response is identical to the first response (same status code and body), confirming the cached result is returned.
    - Submit the same request with Idempotency-Key: test-key-001 as a different consumer B.
    - Verify consumer B's request is processed independently and does not return consumer A's cached result.
    - Verify via server-side inspection or logs that the internal deduplication key combines consumer_id with the Idempotency-Key value.
    expected_result: >-
      Duplicate requests from the same consumer within 7 days return the cached
      response unchanged. Requests from different consumers with the same
      Idempotency-Key value are treated as independent requests with no
      cross-consumer result sharing.
