# Default NFRs — canonical reference catalog
#
# These NFRs are seeded into 03-current/nfr_and_global_cr.yaml by the blueprint
# template. The setup script substitutes <<APP_STARTUP_SCRIPT>> and <<DATE>>.
#
# Review and customize each entry after blueprint setup:
#   - NFR-0000001: verify <<APP_STARTUP_SCRIPT>> resolved to the correct path;
#                  update text and AC criteria if the startup script path differs.
#   - NFR-0000002: add the project-specific code-quality instruction path to text
#                  and AC context if the project has one at a known location.
#
# DO: keep both NFRs in every new blueprint unless explicitly unsuitable for the project.
# DO NOT: delete an NFR without replacing it with a project-specific equivalent.
# DO NOT: leave items: [] in nfr_and_global_cr.yaml for a blueprint with runnable code.
# DO NOT: duplicate these IDs; reserve NFR-0000001 and NFR-0000002 for these defaults.

schema_version: 1
type: nfr_and_global_cr
source: default-catalog
items:
- id: NFR-0000001-startup-operability
  section: Startup Operability
  text: The application repository shall provide a startup script at <<APP_STARTUP_SCRIPT>>
    that starts the application in a runnable local development mode from a standard
    shell environment.
  acceptance_criteria:
  - id: AC-0000001-startup-script-exists-and-starts-app
    title: Startup script exists and starts the app
    context: Developers and automation need a single predictable entry point to start
      the application.
    criteria:
    - A startup script exists at <<APP_STARTUP_SCRIPT>> in the application repository.
    - The script is executable and runnable with bash.
    - Running the script starts the application without requiring manual setup steps
      outside documented environment setup.
    acceptance_tests:
    - id: AT-0000001-verify-startup-script-starts-app
      name: Verify startup script exists and starts the app
      steps:
      - Locate <<APP_STARTUP_SCRIPT>> in the application repository.
      - Verify the file exists and is executable.
      - Run the script from the application repository root.
      - Observe whether the application starts without errors.
      expected_result: The script exists and running it starts the application successfully.
  created_version: 1.0.0
  updated_version: 1.0.0
- id: NFR-0000002-code-quality
  section: Code Quality
  text: All application code shall conform to the project code-quality instructions.
    Both human-written and AI-generated code must comply. The instruction set covers
    engineering principles, secure coding, verification gates, and review hygiene.
  acceptance_criteria:
  - id: AC-0000002-code-follows-code-quality-instructions
    title: Code follows the project code-quality instruction set
    context: The project maintains a code-quality instruction set defining naming,
      module structure, security, testing, and diff hygiene rules.
    criteria:
    - Functions are named as verb-noun. Booleans are named as assertions. Collections
      are named as plurals.
    - Each function performs one job. Nesting does not exceed 3 levels. Guard clauses
      handle invalid cases at the top.
    - Modules are grouped by feature or domain concept, not by technical layer.
    - Explicit typed models exist for request payloads, response payloads, and domain
      entities.
    - All external input is validated at the system boundary for shape, type, range,
      and allowed values.
    - Authorization is checked on every endpoint that accesses protected data.
    - No secrets, keys, tokens, or passwords appear in source code, config files,
      logs, or error responses.
    - Parameterized or ORM-generated queries are used for all database access. No
      string concatenation of user input into SQL or path operations.
    - Every new or changed behavior has a test asserting observable output, not internal
      method calls.
    - Every bug fix includes a regression test that fails without the fix and passes
      with it.
    - Diffs contain no unrelated formatting, renaming, or speculative abstractions.
    acceptance_tests:
    - id: AT-0000002-verify-code-complies-code-quality-instructions
      name: Verify code complies with the code-quality instruction set
      steps:
      - Read the project code-quality instruction set from its configured location.
      - Review source code for naming, function structure, and module organization.
      - Review input validation, authorization, secret handling, and query construction.
      - Review test coverage for new behavior and bug-fix regressions.
      - Review diff hygiene.
      expected_result: Application code conforms to all code-quality rules. No violations
        are present.
  created_version: 1.0.0
  updated_version: 1.0.0
