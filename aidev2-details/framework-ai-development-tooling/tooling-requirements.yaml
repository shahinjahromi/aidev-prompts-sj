schema_version: 1
type: tooling_requirements
generated_at: '2026-03-06'
functional_requirements:
- id: FR-088
  text: The project must maintain a traceability matrix mapping requirements to source
    backlog item identifiers using a project-level traceability matrix file.
  section: Traceability
- id: FR-089
  text: The requirements system must support multiple implementation targets for the
    same requirement set, including implementations in different programming languages.
  section: Traceability
- id: FR-090
  text: Each requirement traceability entry must include per-implementation path mapping
    keyed by app_identifier so implementation-specific scope can be calculated.
  section: Traceability
- id: FR-091
  text: Each implementation must define its own app_identifier in the app manifest;
    tooling validates this value matches the requirements manifest before execution.
  section: Traceability
- id: FR-092
  text: The tooling package must provide a single action script that supports bootstrap,
    merge, diff, scope, promote, and all actions without requiring direct Python script
    calls.
  section: Traceability
- id: FR-093
  text: Bootstrap and requirement generation must include all requirement document
    types under docs/requirements, including api_contracts, business_context, change_log,
    data_contracts, decisions, glossary, acceptance_tests, functional_requirements,
    nfr_and_global_cr, and ui_contracts when available.
  section: Traceability
- id: FR-094
  text: Each tooling requirement record must include an iteration_id and it must only
    be considered for implementation when it matches the app manifest iteration_id.
  section: Traceability
- id: FR-095
  text: Tooling must generate implementation-specific pending lists by computing the
    difference between app requirement IDs and versioned requirement_baseline entries from the
    app manifest.
  section: Traceability
- id: FR-096
  text: Requirements changes must support pending files per artifact type, including
    requirements, acceptance tests, and contract artifacts.
  section: Traceability
- id: FR-097
  text: The pending requirements promotion queue must be stored under changes/pending-promotion
    and implementation work queues must be generated under changes/pending-implementation
    using the filename format <requirement_type>-<implementation_id>-pending-implementation.yaml.
  section: Traceability
- id: FR-098
  text: Pending promotion artifact files must use the same schema structure as their
    target requirement artifact files and contain promotable item collections only.
  section: Traceability
- id: FR-099
  text: Pending implementation files must use filename format <requirement_type>-<implementation_id>-pending-implementation.yaml
    and include top-level implementation_id.
  section: Traceability
- id: FR-100
  text: Implementation targeting must be stored in separate files under requirements/implementation_mappings
    per requirement type; if a requirement id has no mapping entry, it applies to
    all implementations.
  section: Traceability
nfr_and_global_cr:
- id: NFR-021
  text: Requirements and outputs must remain deterministic and diff-friendly for version
    control, avoiding unnecessary churn.
  section: Maintainability
- id: NFR-027
  text: Reusable AI code-generation tooling must accept requirements path and app
    path parameters and validate requirement_set_id alignment before execution.
  section: Maintainability
- id: NFR-028
  text: Scope generation must support multiple registered implementations and produce
    per-implementation context scope outputs.
  section: Maintainability
- id: NFR-029
  text: App manifest must include app_identifier and it must match the app_identifier
    used in requirement traceability for targeted implementation.
  section: Maintainability
- id: NFR-030
  text: Promoting an update to an existing requirement must generate a standalone
    history diff file containing prior and current snapshots.
  section: Maintainability
- id: NFR-031
  text: All reusable tooling must support multiple implementation targets and validate
    app_identifier plus requirement_set_id before execution.
  section: Maintainability
- id: NFR-032
  text: Traceability must allow wildcard app_identifier entries and empty globs; exact
    app_identifier mappings with explicit scope must override wildcard mappings with
    empty scope.
  section: Maintainability
- id: NFR-033
  text: All tooling examples and operational runbooks must use the action script interface
    instead of direct Python script invocations.
  section: Maintainability
- id: NFR-034
  text: The requirements tooling must ingest all generated YAML requirement documents
    and deterministically map them into diff requirements without requiring manual
    per-document script changes.
  section: Maintainability
- id: NFR-035
  text: App manifests must define requirements_version_target and requirements_version_implemented,
    and tooling must validate these values before execution.
  section: Maintainability
- id: NFR-036
  text: Every pending integration must stamp requirement versioning deterministically
    so created_on_version and updated_on_version remain auditable across releases.
  section: Maintainability
- id: NFR-037
  text: All requirements must support implementation targeting with implementation_id
    and wildcard matching, and non-functional requirements must always be included
    for matching implementations regardless of running delta calculations.
  section: Maintainability
- id: NFR-038
  text: On every promotion, requirements versions must advance, existing requirements
    must preserve created_version and receive updated_version of the promoted version,
    and newly created requirements must set created_version and updated_version to
    the promoted version.
  section: Maintainability
- id: NFR-039
  text: After promotion, merged outputs must be generated automatically in split files
    per requirement artifact type under requirements/merged, in addition to consolidated
    merged requirements where applicable.
  section: Maintainability
- id: NFR-040
  text: Requirement diffs must include the applied requirement version for create
    and update operations; new requirements must set updated version equal to created
    version.
  section: Maintainability
- id: NFR-041
  text: Scope and implementation-pending tooling must resolve implementation applicability
    from requirements/implementation_mappings and default to wildcard-all when a requirement
    mapping is not present.
  section: Maintainability
decisions:
- id: DEC-001
  text: Adopt a unified, repo-friendly requirements export under docs/requirements/
    with stable FR and NFR identifiers.
  section_path:
  - Decisions
  - '2026-02-26'
