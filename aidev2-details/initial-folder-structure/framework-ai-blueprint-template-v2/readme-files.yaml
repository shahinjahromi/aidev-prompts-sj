schema_version: 1
project: "<<SPECS_REPO_DIR>>"
layout:
  - folder: instructions
    purpose: Single configuration file, AI context, command reference, and AI onboarding README.
    file_types:
      - pattern: README.md
        purpose: How to prompt assistants to learn from instructions and how to run setup/setup.sh for a new instance.
      - pattern: config.yaml
        purpose: Identity (requirement_set_id, app_identifier), paths, implementations, variables. Single source of truth.
      - pattern: codebase-context.yaml
        purpose: Per-implementation project structure, tech stack, file maps for AI.
      - pattern: ai-tooling-hints.yaml
        purpose: Fixed implementation layout, mapping guide, gotchas, patterns, shapes.
      - pattern: instructions.txt
        purpose: Environment setup and command reference.
      - pattern: explanation.txt
        purpose: Full pipeline explanation.
      - pattern: add-or-update-pending-requirement-prompt.txt
        purpose: Prompt for adding/updating requirements.
  - folder: 01-requirements
    purpose: Canonical requirements source, promotion staging, and requirement diffs.
    file_types:
      - pattern: control.yaml
        purpose: Version management only (iteration_id, current_version, next_version).
      - pattern: 01-pending-promotion/**/*.yaml
        purpose: Pending requirement artifacts awaiting promotion.
      - pattern: 01-pending-promotion/technology-selection/technology_selections_<implementation_id>.yaml
        purpose: Per-implementation pending technology-selection mirror files derived from the stage-root technology_selection.yaml.
      - pattern: 02-diff/<bucket>/<REQUIREMENT_ID>.yaml
        purpose: Per-requirement diff history files. One file per requirement, named by ID inside a type bucket (functional/, nfr-and-global-cr/, technology-selection/, contracts/, ui_contracts/). Enables direct filename lookup for full change history including removals.
      - pattern: 03-current/**/*.yaml
        purpose: Current grouped requirement artifacts.
      - pattern: 03-current/technology-selection/technology_selections_<implementation_id>.yaml
        purpose: Per-implementation current technology-selection mirror files derived from the stage-root technology_selection.yaml.
      - pattern: 03-current/merged/*.yaml
        purpose: Generated merged requirement outputs.
  - folder: 02-implementation
    purpose: Per-implementation execution state, shared prompts, and implementation mappings.
    file_types:
      - pattern: 00-prompts/*.txt
        purpose: Shared prompts (implementation-agnostic, numbered by pipeline run order).
      - pattern: 02-implementation-mapping/scope.yaml
        purpose: Global default execution scope per implementation_id (globs/files/folders).
      - pattern: 02-implementation-mapping/<type>.yaml
        purpose: Per-type mapping rules (which implementations each requirement type applies to).
      - pattern: 01-implementations/<implementation_id>/ai-app-hints.yaml
        purpose: Tooling-maintained implementation-specific app hints.
      - pattern: 01-implementations/<implementation_id>/01-delta-current/structured-diff.yaml
        purpose: Structured diff; created/updated/removed vs app baseline.
      - pattern: 01-implementations/<implementation_id>/02-plan-current/*.md
        purpose: Current AI implementation plan.
      - pattern: 01-implementations/<implementation_id>/03-plan-execution/*.yaml
        purpose: Plan execution paths and results.
      - pattern: 01-implementations/<implementation_id>/04-extract-library-interfaces/*
        purpose: Library API snapshots.
      - pattern: 01-implementations/<implementation_id>/05-fix/*
        purpose: Fix artifacts.
      - pattern: 01-implementations/<implementation_id>/06-e2e-tests/*
        purpose: Playwright acceptance tests (API and browser).
      - pattern: 01-implementations/<implementation_id>/50-delta-history/*.yaml
        purpose: Historical snapshots of prior delta files.
      - pattern: 01-implementations/<implementation_id>/51-plan-history/*
        purpose: Archived historical AI plan files.
      - pattern: 01-implementations/<implementation_id>/52-plan-execution-history/*
        purpose: Archived execution results.
      - pattern: 01-implementations/<implementation_id>/53-update-history/*
        purpose: Implementation-specific change history.
  - folder: scripts
    purpose: Repository helper scripts used to prepare local AI agent configuration.
    file_types:
      - pattern: *.sh
        purpose: Utility shell scripts for repo setup and maintenance.
  - folder: setup
    purpose: Template-only bootstrap assets used to create a new blueprint instance.
    file_types:
      - pattern: setup.sh
        purpose: Creates a new app blueprint instance from this template.
      - pattern: .instructions/*
        purpose: Guidance for using the template bootstrap flow correctly.
  - folder: update-history
    purpose: Time-stamped change history entries for tooling and pipeline updates.
